name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports
        run: |
          python -c "from backend.runner import run_evaluation; print('✅ runner OK')"
          python -c "from backend.metrics.length import score_length; print('✅ length OK')"
          python -c "from backend.metrics.readability import score_readability; print('✅ readability OK')"
          python -c "from backend.metrics.sentiment import score_sentiment; print('✅ sentiment OK')"

      - name: Check FastAPI app loads
        run: python -c "from backend.main import app; print('✅ FastAPI OK')"
        env:
          GEMINI_API_KEY: dummy
          HF_API_KEY: dummy
          OPENAI_API_KEY: dummy